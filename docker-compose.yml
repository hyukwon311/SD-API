services:
  speaker-diarization-api:
    build:
      context: .
      dockerfile: Dockerfile
      args : 
        UID : ${UID}
        GID : ${GID}

    image: speaker-diarization-api:latest
    container_name: speaker-diarization-api
    
    environment:
      - TZ=Asia/Seoul
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=all

    ports:
      - "9600:9100"
    
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

        limits:
          memory: 8G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - api-network

networks:
  api-network:
    driver: bridge