services:
  speaker-diarization-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: speaker-diarization-api:latest
    container_name: speaker-diarization-api

    environment:
      - TZ=Asia/Seoul
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=all

    ports:
      - "9600:9100"

    volumes:
      - diarization-data:/app/data   # 임시 오디오 파일 저장 (실제 사용)
      - diarization-logs:/app/logs   # 로그 저장

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - api-network

volumes:
  diarization-data:    # /app/data (temp_audio 포함)
  diarization-logs:    # /app/logs

networks:
  api-network:
    driver: bridge